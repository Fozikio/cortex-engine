name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  # Name kept verbatim — branch protection requires the "Type Check" context,
  # and renaming it would leave PRs waiting on a check that no longer reports.
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.json

  # The suite was configured but never ran in CI, so the merge gate only ever
  # checked types. Windows is in the matrix because service supervision is
  # platform-specific: detached spawning, taskkill and PID handling all differ
  # there, and an ubuntu-only gate cannot see any of it.
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # Gates on high/critical only. Moderates are deliberately not a merge
  # blocker: some transitive advisories have no fix reachable without
  # breaking changes, and a gate that cannot be satisfied gets ignored or
  # bypassed rather than fixed. High and above must stay at zero.
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  # package.json claims `engines: node >=20`, but every other job runs 24,
  # so the claim was never tested. This job is the evidence for it. If it
  # fails, the honest fix is to raise `engines` — not to delete this job.
  node20:
    name: Node 20 Compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
