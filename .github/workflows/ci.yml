name: CI

# Lean shape: non-draft PRs only, one job, no re-run on push to master (the PR's run already checked the code).
# The merge gate is the `local-ci` status from `npm run ci:local` (scripts/ci-local.ts), which runs these same
# checks on Windows, so the old windows-latest test leg is covered there. This job is the clean-Linux second opinion.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # package.json claims `engines: node >=22`, so the floor runs first. If it fails, the honest fix is to raise
      # `engines`, not to drop this leg.
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type Check
        run: npx tsc -p tsconfig.json --noEmit
      - name: Build (Node 22)
        run: npm run build
      - name: Test (Node 22)
        run: npm test

      # Gates on high/critical only. Moderates are deliberately not a blocker: some transitive advisories have no fix
      # reachable without breaking changes, and a gate that cannot be satisfied gets bypassed rather than fixed.
      - name: Audit
        run: npm audit --audit-level=high

      # Current LTS. Reinstall so better-sqlite3 matches this ABI.
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test (Node 24)
        run: npm test
