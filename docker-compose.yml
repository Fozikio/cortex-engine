# Cortex Engine — Quick Start
# Run: docker compose up -d
# Cortex API: http://localhost:8080
# Firestore UI: http://localhost:8180
#
# This serves the REST API. It is not an MCP endpoint: Claude Code's `.mcp.json`
# needs the stdio server (`cortex-engine`) or an MCP-over-HTTP transport, which
# the REST server does not expose yet (#92).
#
# Requires CORTEX_API_TOKEN in the environment; requests send it as x-cortex-token.

services:
  cortex:
    image: ghcr.io/fozikio/cortex-engine:latest
    ports:
      - "8080:8080"
    environment:
      FIRESTORE_EMULATOR_HOST: firestore:8180
      GCP_PROJECT_ID: cortex-local
      PORT: "8080"
      NODE_ENV: development
      CORS_ORIGINS: "*"
      CORTEX_INSTANCE_NAME: cortex
      # The REST server refuses to start without a token (or --allow-unauthenticated).
      # Export CORTEX_API_TOKEN before `docker compose up`.
      CORTEX_API_TOKEN: ${CORTEX_API_TOKEN:?set CORTEX_API_TOKEN before starting}
    depends_on:
      - firestore
    restart: unless-stopped
    networks:
      - cortex

  firestore:
    image: google/cloud-sdk:emulators
    command: ["gcloud", "emulators", "firestore", "start", "--host-port=0.0.0.0:8180", "--project=cortex-local"]
    ports:
      - "8180:8180"
    restart: unless-stopped
    networks:
      - cortex

networks:
  cortex:
    driver: bridge
